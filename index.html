<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <title>Aula Virtual</title>
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('aula-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><p class="loading">Cargando…</p></div>
  <button id="theme" class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro"></button>
  <div id="toast" class="toast" hidden></div>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pptx-converter.js"></script>
  <script src="js/lesson-renderer.js"></script>
  <script>(function(){var b=document.getElementById("theme"),r=document.documentElement;function s(t){r.setAttribute("data-theme",t);try{localStorage.setItem("aula-theme",t)}catch(e){}b.textContent=t==="dark"?"\u2600\uFE0F":"\uD83C\uDF19"}b.textContent=r.getAttribute("data-theme")==="dark"?"\u2600\uFE0F":"\uD83C\uDF19";b.onclick=function(){s(r.getAttribute("data-theme")==="dark"?"light":"dark")}})()</script>
  <script src="js/app.js"></script>
</body>
</html>
